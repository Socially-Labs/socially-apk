<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Sailing home loading"><title>Sailing home</title>
<style>@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes flow{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}.boat{transform-origin:32px 41px;animation:rock 1.8s ease-in-out infinite}.sea{animation:flow 1.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.boat,.sea{animation:none}}</style>
<g class="boat" stroke="#182B43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6V42M27 12L11 36L27 38Z" fill="none"/><path d="M36 10L53 38H36Z" fill="#A9CDE8" stroke="none"/><path d="M7 43H57Q53 54 42 54H22Q11 54 7 43Z" fill="none"/></g><g class="sea" fill="none" stroke="#64758B" stroke-width="2" stroke-linecap="round"><path d="M10 58Q20 53 32 58T54 58"/></g>
</svg>
