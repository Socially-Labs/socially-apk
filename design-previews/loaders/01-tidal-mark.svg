<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Tidal mark loading"><title>Tidal mark</title>
<style>@keyframes tide{0%,100%{stroke-dashoffset:100;opacity:.45}50%{stroke-dashoffset:0;opacity:1}}.wave{stroke-dasharray:100;animation:tide 1.6s ease-in-out infinite}.w2{animation-delay:-.2s}.w3{animation-delay:-.4s}@media(prefers-reduced-motion:reduce){.wave{animation:none;stroke-dashoffset:0}}</style>
<g fill="none" stroke-linecap="round" stroke-width="2"><path class="wave" stroke="#64758B" pathLength="100" d="M8 20Q20 10 32 20T56 20"/><path class="wave w2" stroke="#182B43" pathLength="100" d="M8 32Q20 22 32 32T56 32"/><path class="wave w3" stroke="#64758B" pathLength="100" d="M8 44Q20 34 32 44T56 44"/></g>
</svg>
